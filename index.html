<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Professionale | Supabase</title>
  
  <!-- Font e Icone -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --white: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg );
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: var(--text-main);
    }

    /* --- CONTENITORE AUTH --- */
    #auth-section {
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.5s ease-out;
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px 0; color: var(--text-main); }
    .header p { color: var(--text-muted); font-size: 15px; }

    .tabs {
      display: flex;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 30px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--white);
      color: var(--primary);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group { margin-bottom: 20px; }
    .full-width { grid-column: span 2; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      width: 18px;
    }

    input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: #fafafa;
      transition: all 0.2s;
      outline: none;
    }

    input:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
    }

    #error-msg {
      color: #ef4444;
      background: #fef2f2;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 20px;
      display: none;
      text-align: center;
      border: 1px solid #fee2e2;
    }

    /* --- SEZIONE TABELLA --- */
    #dashboard-section {
      display: none;
      width: 100%;
      max-width: 1100px;
      animation: fadeIn 0.6s ease;
    }

    .table-container {
      background: var(--white);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      background: #f8fafc;
      padding: 20px 24px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 20px 24px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }

    .user-info { display: flex; align-items: center; gap: 15px; }
    .user-avatar {
      width: 50px;
      height: 50px;
      background: var(--primary);
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .signup-field { display: none; }
  </style>
</head>
<body>

  <!-- SCHERMATA LOGIN / REGISTRAZIONE -->
  <section id="auth-section">
    <div class="card">
      <div class="header">
        <h1 id="title">Bentornato</h1>
        <p id="subtitle">Accedi per gestire il tuo team</p>
      </div>

      <div class="tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchMode('login')">Accedi</button>
        <button id="tab-signup" class="tab-btn" onclick="switchMode('signup')">Registrati</button>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="form-grid">
          <!-- Nome e Cognome -->
          <div class="form-group full-width signup-field">
            <label>Nome e Cognome</label>
            <div class="input-wrapper">
              <i data-lucide="user"></i>
              <input type="text" id="reg-name" placeholder="Mario Rossi">
            </div>
          </div>

          <!-- Email -->
          <div class="form-group full-width">
            <label>Email Professionale</label>
            <div class="input-wrapper">
              <i data-lucide="mail"></i>
              <input type="email" id="auth-email" placeholder="mario@azienda.it" required>
            </div>
          </div>

          <!-- Telefono -->
          <div class="form-group signup-field">
            <label>Telefono</label>
            <div class="input-wrapper">
              <i data-lucide="phone"></i>
              <input type="tel" id="reg-phone" placeholder="+39 333...">
            </div>
          </div>

          <!-- Data Nascita -->
          <div class="form-group signup-field">
            <label>Data di Nascita</label>
            <div class="input-wrapper">
              <i data-lucide="calendar"></i>
              <input type="date" id="reg-dob">
            </div>
          </div>

          <!-- Password -->
          <div class="form-group full-width">
            <label>Password</label>
            <div class="input-wrapper">
              <i data-lucide="lock"></i>
              <input type="password" id="auth-password" placeholder="••••••••" required>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-text">Accedi Ora</button>
        <div id="error-msg"></div>
      </form>
    </div>
  </section>

  <!-- SCHERMATA DASHBOARD (TABELLA) -->
  <section id="dashboard-section">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;">
      <div>
        <h1 style="margin: 0; font-size: 32px;">Dashboard Team</h1>
        <p style="margin: 5px 0 0 0; color: var(--text-muted);">Dati sincronizzati da Supabase Cloud</p>
      </div>
      <button onclick="logout()" style="padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 600;">Esci</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Membro</th>
            <th>Contatto</th>
            <th>Data Nascita</th>
            <th>Data Registrazione</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Righe generate da JS -->
        </tbody>
      </table>
    </div>
  </section>

  <script>
    lucide.createIcons();

    // ⚠️ CONFIGURAZIONE: Inserisci qui le tue chiavi Supabase
    const SB_URL = 'https://yzvksxgiuqhhvrqoqjak.supabase.co';
    const SB_KEY = 'sb_publishable_hHYDgay49GSkgvnHDsWC0g_CTEx75OU';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    let mode = 'login';

    function switchMode(newMode) {
      mode = newMode;
      const signupFields = document.querySelectorAll('.signup-field');
      const title = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');
      const btnText = document.getElementById('btn-text');
      
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('error-msg').style.display = 'none';

      if (mode === 'signup') {
        signupFields.forEach(f => f.style.display = 'block');
        title.innerText = 'Crea Account';
        subtitle.innerText = 'Unisciti al nostro team oggi';
        btnText.innerText = 'Registrati ora';
      } else {
        signupFields.forEach(f => f.style.display = 'none');
        title.innerText = 'Bentornato';
        subtitle.innerText = 'Accedi per gestire il tuo team';
        btnText.innerText = 'Accedi Ora';
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const errorDiv = document.getElementById('error-msg');
      errorDiv.style.display = 'none';

      try {
        if (mode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;

          // Salva i dati extra nella tabella 'profiles'
          const { error: pError } = await supabaseClient.from('profiles').insert([{
            id: data.user.id,
            full_name: document.getElementById('reg-name').value,
            email: email,
            phone: document.getElementById('reg-phone').value,
            birth_date: document.getElementById('reg-dob').value
          }]);
          if (pError) throw pError;
          
          alert("Registrazione completata! Ora puoi accedere.");
          switchMode('login');
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showDashboard();
        }
      } catch (err) {
        errorDiv.innerText = err.message;
        errorDiv.style.display = 'block';
      }
    }

    async function showDashboard() {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('dashboard-section').style.display = 'block';

      const { data, error } = await supabaseClient.from('profiles').select('*');
      if (error) return;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = data.map(u => `
        <tr>
          <td>
            <div class="user-info">
              <div class="user-avatar">${u.full_name.charAt(0)}</div>
              <div style="font-weight: 600;">${u.full_name}</div>
            </div>
          </td>
          <td>
            <div style="font-weight: 500;">${u.email}</div>
            <div style="font-size: 12px; color: var(--text-muted);">${u.phone}</div>
          </td>
          <td>${u.birth_date}</td>
          <td style="color: var(--text-muted);">${new Date(u.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }
  </script>
</body>
</html>
