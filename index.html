<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');

body {
    font-family: 'Rajdhani', Arial, sans-serif;
}

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at top, #16213e, #050510 70%);
        font-family: 'Orbitron', sans-serif;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 90%;
        max-width: 1000px;
        padding: 30px;
    }

    h1 {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 3px;
}

th {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
}

td {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.5px;
}

    .table-box {
        border: 2px solid #00f7ff;
        border-radius: 15px;
        overflow: hidden;
        background: rgba(0, 10, 30, 0.8);
        box-shadow:
            0 0 15px #00f7ff,
            inset 0 0 20px rgba(0,247,255,0.3);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: linear-gradient(90deg, #00f7ff, #0066ff);
        color: #050510;
        padding: 18px;
        font-size: 16px;
        text-transform: uppercase;
    }

    td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid rgba(0,247,255,0.3);
        color: #d8ffff;
    }

    tr {
        transition: 0.3s;
    }

    tbody tr:hover {
        background: rgba(0,247,255,0.15);
        transform: scale(1.02);
        box-shadow:
            0 0 20px #00f7ff;
    }

    .username {
        color: #ffcc00;
        font-weight: bold;
        text-shadow: 0 0 10px #ffcc00;
    }

    .creation {
        color: #39FF14;
        text-shadow: 0 0 10px #39FF14;
    }

    .friends {
        color: #00E5FF;
        text-shadow: 0 0 10px #00E5FF;
    }

    .suspend {
        color: #ff00ff;
        text-shadow: 0 0 10px #ff00ff;
    }
	
	.robux {
		color: #FF1744;
		text-shadow: 0 0 10px #FF1744;
	}
	
	.price {
		color: #F4A460;
		text-shadow: 0 0 10px #F4A460;
	}
	
	.account-img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid #00f7ff;
    box-shadow: 0 0 10px #00f7ff;
}

td {
    padding: 15px;
    text-align: center;
    color: #d8ffff;
    border-bottom: 1px solid rgba(0, 247, 255, 0.3);
    border-right: 1px solid rgba(0, 247, 255, 0.4);
}

th {
    border-right: 1px solid rgba(5, 5, 16, 0.4);
}

</style>

</head>

<body>

<div class="container">

<h1>Nexora</h1>

<div class="table-box">

<table>

<thead>
<tr>
	<th>Immagine</th>
    <th>Username</th>
    <th>Data creazione</th>
    <th>Friends</th>
	<th>Friends in sospeso</th>
	<th>Robux</th>
	<th>Prezzo</th>
</tr>
</thead>

<tbody>

<tr>
    <td>
        <img src="CrystalFox741.webp" alt="Immagine account" class="account-img">
    </td>
    <td class="username">CrystalFox741</td>
    <td class="creation">09.08.2026</td>
    <td class="friends">1</td>
	<td class="suspend">18</td>
	<td class="robux">X</td>
    <td class="price">0.56€</td>
</tr>

<tr>
    <td>
        <img src="img/matrix.jpg" alt="Immagine account" class="account-img">
    </td>
    <td class="username">X</td>
    <td class="creation">X</td>
    <td class="friends">X</td>
	<td class="suspend">X</td>
	<td class="robux">X</td>
    <td class="price">X</td>
</tr>

<tr>
    <td>
        <img src="img/matrix.jpg" alt="Immagine account" class="account-img">
    </td>
    <td class="username">X</td>
    <td class="creation">X</td>
    <td class="friends">X</td>
	<td class="suspend">X</td>
	<td class="robux">X</td>
    <td class="price">X</td>
</tr>

<tr>
    <td>
        <img src="img/matrix.jpg" alt="Immagine account" class="account-img">
    </td>
    <td class="username">X</td>
    <td class="creation">X</td>
    <td class="friends">X</td>
	<td class="suspend">X</td>
	<td class="robux">X</td>
    <td class="price">X</td>
</tr>

</tbody>

</table>

</div>

</div>

</body>
</html>
